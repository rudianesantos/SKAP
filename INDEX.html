<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKAP</title>

<style>

:root{
    --blue:#123d78;
    --orange:#f5a623;
    --paper:#fffdf6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--blue);
    color:white;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:radial-gradient(
        circle at top right,
        #245da9,
        #123d78 50%,
        #0b2c5a
    );
}

.cover-card{
    width:min(680px,100%);
    text-align:center;
}

.logo{
    width:min(360px,82vw);
    height:auto;
    margin:auto;
    display:block;
    margin-bottom:20px;
    border-radius:50%;
    object-fit:contain;
}

.cover h1{
    font-size:clamp(32px,7vw,52px);
    margin:0;
}

.cover h1 span{
    color:var(--orange);
}

.cover p{
    font-size:17px;
    line-height:1.5;
    margin:15px auto 25px;
    color:#e8eef8;
}

.cover-cpf{
    width:min(420px,100%);
    margin:auto;
    text-align:left;
}

.cover-cpf label{
    color:white;
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:16px;
    border-radius:10px;
    border:2px solid #c7d4e3;
    font-size:19px;
    outline:none;
}

input:focus{
    border-color:var(--orange);
}

.btn{
    border:0;
    border-radius:10px;
    padding:16px 24px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    margin-top:12px;
}

.btn-primary{
    background:var(--orange);
    color:#17365f;
}

.btn-secondary{
    background:white;
    color:var(--blue);
}

.cover .btn-primary{
    width:min(420px,100%);
}

.app{
    display:none;
    min-height:100vh;
    padding:25px 14px;
    background:linear-gradient(
        135deg,
        #123d78,
        #1e58a0
    );
}

.app.show{
    display:block;
}

.top{
    max-width:720px;
    margin:auto;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:12px;
}

.mini-logo{
    width:62px;
    height:62px;
    object-fit:contain;
    background:white;
    border-radius:50%;
    padding:4px;
}

.top-title{
    font-size:24px;
    font-weight:bold;
}

.top-sub{
    font-size:13px;
    color:#dbe8fa;
}

.notebook{
    max-width:720px;
    margin:auto;
    background:var(--paper);
    color:#222;
    border-radius:14px;
    padding:28px 30px 35px;
    min-height:580px;
    position:relative;

    background-image:
    repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        #dce5ee 32px
    );
}

.notebook:before{
    content:"";
    position:absolute;
    left:48px;
    top:0;
    bottom:0;
    width:2px;
    background:#efaaaa;
}

.inner{
    margin-left:36px;
}

.note-title{
    color:var(--blue);
    font-size:28px;
    font-weight:bold;
}

.note-sub{
    font-family:"Courier New";
    color:#526273;
    margin:8px 0 25px;
}

label{
    display:block;
    color:var(--blue);
    font-weight:bold;
    margin-bottom:8px;
}

.search{
    width:100%;
    background:var(--blue);
    color:white;
}

.result{
    display:none;
    margin-top:25px;
}

.hello{
    font-size:22px;
    font-weight:bold;
    color:var(--blue);
    margin-bottom:14px;
}

.block{
    background:white;
    border-left:7px solid var(--blue);
    padding:16px;
    margin-top:14px;
    border-radius:9px;
}

.orange{
    border-left-color:var(--orange);
}

.star{
    border-left-color:#e5b600;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:#6b7280;
}

.value{
    font-size:18px;
    font-weight:bold;
    margin-top:7px;
    line-height:1.4;
}

.explain{
    margin-top:12px;
    padding:14px;
    background:#eef4fb;
    color:#31455f;
    border-radius:8px;
    line-height:1.5;
}

.audit-note{
    margin-top:20px;
    padding:14px;
    border:1px dashed #9eb7d7;
    color:#425a76;
    border-radius:8px;
}

.error{
    background:#fff1f1;
    border-left:6px solid #cc4444;
    padding:14px;
    color:#8b1f1f;
    border-radius:8px;
}

.principles{
    display:none;
    margin-top:22px;
}

.principles.show{
    display:block;
}

.principle{
    padding:12px;
    margin:8px 0;
    background:white;
    border:1px solid #e0e7ef;
    border-radius:8px;
    color:#283b55;
}

.principle.active{
    background:#fff4cf;
    border:2px solid var(--orange);
    font-weight:bold;
}

.small-btn{
    background:var(--orange);
    color:#17365f;
    width:100%;
}

.back{
    background:#6b7280;
    color:white;
    width:100%;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#d9e6f7;
    font-size:12px;
}

@media(max-width:520px){

    .notebook{
        padding:24px 18px;
    }

    .notebook:before{
        left:30px;
    }

    .inner{
        margin-left:18px;
    }

}

</style>
</head>

/* FORMATA CPF */

function formatarCPF(input){

let v=input.value
.replace(/\D/g,'')

.slice(0,11);


if(v.length>9){

v=v.replace(
/(\d{3})(\d{3})(\d{3})(\d{0,2})/,
'$1.$2.$3-$4'
);

}

else if(v.length>6){

v=v.replace(
/(\d{3})(\d{3})(\d{0,3})/,
'$1.$2.$3'
);

}

else if(v.length>3){

v=v.replace(
/(\d{3})(\d{0,3})/,
'$1.$2'
);

}

input.value=v;

}


/* CONSULTA DA CAPA */

function consultarDaCapa(){

const campo=
document.getElementById("cpfCapa");

const cpf=
campo.value.replace(/\D/g,'');


if(cpf.length!==11){

campo.focus();

campo.style.borderColor="#d64545";

return;

}


abrirConsulta();


document.getElementById("cpf").value=
campo.value;


consultar();

}

/* VER PRINCÍPIOS */

function verPrincipios(numero){

const pbox=
document.getElementById("principios");


pbox.classList.add("show");


renderPrincipios(numero);


pbox.scrollIntoView({

behavior:"smooth"

});

}

function abrirPrincipiosCapa(){

abrirConsulta();

document.getElementById("principios");

}


/* MOSTRAR PRINCÍPIOS */

function renderPrincipios(active){

const pbox=
document.getElementById("principios");


let html=

'<div class="note-title" style="font-size:23px;margin-top:8px">OS 10 PRINCÍPIOS</div>'+

'<div class="note-sub">Nossa jornada de desenvolvimento também é uma forma de viver a nossa cultura.</div>';


Object.keys(principios)
.forEach(n=>{


const cls=

String(n)===String(active)

?

"principle active"

:

"principle";


html+=`

<div class="${cls}">

<b>

${String(n).padStart(2,"0")}

</b>

${principios[n]}

${String(n)===String(active)
?
"⭐"
:
""}

</div>

`;

});


pbox.innerHTML=html;

}


/* NOVA CONSULTA */

function novaConsulta(){

.getElementById("cpf")

.getElementById("resultado")

.getElementById("principios")
.classList.remove("show");

.getElementById("cpf")
.focus();

}
